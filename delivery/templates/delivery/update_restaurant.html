{% extends 'delivery/base.html' %}

{% block title %}Edit {{ restaurant.name }} | Admin | BiteNest{% endblock %}

{% block content %}
  <div class="form-container">
    <h2 class="form-title">Edit Restaurant</h2>
    <p class="form-subtitle">Update details for {{ restaurant.name }}</p>

    <form action="{% url 'update_restaurant' restaurant.id %}" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="name" class="form-label">Restaurant Name</label>
        <input type="text" id="name" name="name" class="form-control" value="{{ restaurant.name }}" required>
      </div>

      <div class="form-group">
        <label for="cuisine" class="form-label">Cuisine Category</label>
        <input type="text" id="cuisine" name="cuisine" class="form-control" value="{{ restaurant.cuisine }}" required>
      </div>

      <div class="form-group">
        <label for="rating" class="form-label">Rating</label>
        <input type="number" step="0.1" min="1.0" max="5.0" id="rating" name="rating" class="form-control" value="{{ restaurant.rating }}" required>
      </div>

      <div class="form-group">
        <label for="picture" class="form-label">Image URL</label>
        <input type="url" id="picture" name="picture" class="form-control" value="{{ restaurant.picture }}" required>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Short Description</label>
        <textarea id="description" name="description" class="form-control" required>{{ restaurant.description }}</textarea>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">Update Restaurant</button>
        <a href="{% url 'admin_restaurants' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
