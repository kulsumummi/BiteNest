{% extends 'delivery/base.html' %}

{% block title %}Register Account | BiteNest{% endblock %}

{% block content %}
  <div class="form-container">
    <h2 class="form-title">Create Account</h2>
    <p class="form-subtitle">Join BiteNest to order meals from top restaurants</p>

    <form action="{% url 'signup' %}" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" required>
      </div>

      <div class="form-group">
        <label for="mobile" class="form-label">Phone Number</label>
        <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="e.g. +91 9876543210" required>
      </div>

      <div class="form-group">
        <label for="address" class="form-label">Delivery Address</label>
        <textarea id="address" name="address" class="form-control" placeholder="House/Flat No., Street, City, Pincode" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Create Account & Proceed</button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="{% url 'signin' %}" style="font-weight: 700;">Sign In here</a>
    </div>
  </div>
{% endblock %}
