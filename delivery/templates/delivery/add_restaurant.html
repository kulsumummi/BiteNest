{% extends 'delivery/base.html' %}

{% block title %}Add Restaurant | Admin | BiteNest{% endblock %}

{% block content %}
  <div class="form-container">
    <h2 class="form-title">Add New Restaurant</h2>
    <p class="form-subtitle">Enter restaurant details to publish on BiteNest</p>

    <form action="{% url 'add_restaurant' %}" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="name" class="form-label">Restaurant Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Spice Garden" required>
      </div>

      <div class="form-group">
        <label for="cuisine" class="form-label">Cuisine Category</label>
        <input type="text" id="cuisine" name="cuisine" class="form-control" placeholder="e.g. North Indian, Mughlai" required>
      </div>

      <div class="form-group">
        <label for="rating" class="form-label">Rating (1.0 to 5.0)</label>
        <input type="number" step="0.1" min="1.0" max="5.0" id="rating" name="rating" class="form-control" value="4.5" required>
      </div>

      <div class="form-group">
        <label for="picture" class="form-label">Image URL</label>
        <input type="url" id="picture" name="picture" class="form-control" placeholder="https://images.unsplash.com/..." required>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Short Description</label>
        <textarea id="description" name="description" class="form-control" placeholder="Describe the ambiance, specialty, or highlights..." required></textarea>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">Save Restaurant</button>
        <a href="{% url 'admin_restaurants' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
