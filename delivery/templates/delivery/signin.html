{% extends 'delivery/base.html' %}

{% block title %}Sign In | BiteNest{% endblock %}

{% block content %}
  <div class="form-container">
    <h2 class="form-title">Welcome Back</h2>
    <p class="form-subtitle">Sign in to BiteNest to place your food order</p>

    <form action="{% url 'signin' %}" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Sign In</button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{% url 'signup' %}" style="font-weight: 700;">Register here</a>
    </div>

    <div style="margin-top: 20px; padding: 12px; background-color: var(--bg-cream); border-radius: var(--radius-sm); font-size: 0.82rem; color: var(--text-muted); text-align: center;">
      💡 <strong>Demo Admin Account:</strong> Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
  </div>
{% endblock %}
