{% extends 'delivery/base.html' %}

{% block title %}Add Menu Item | Admin | BiteNest{% endblock %}

{% block content %}
  <div class="form-container">
    <h2 class="form-title">Add Menu Item</h2>
    <p class="form-subtitle">Add a new dish to {{ restaurant.name }}'s menu</p>

    <form action="{% url 'add_menu_item' restaurant.id %}" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="name" class="form-label">Item / Dish Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Paneer Butter Masala" required>
      </div>

      <div class="form-group">
        <label for="category" class="form-label">Category</label>
        <input type="text" id="category" name="category" class="form-control" placeholder="e.g. Starter, Main Course, Dessert, Drinks" value="Main Course" required>
      </div>

      <div class="form-group">
        <label for="price" class="form-label">Price (INR ₹)</label>
        <input type="number" step="0.5" min="0" id="price" name="price" class="form-control" placeholder="e.g. 290" required>
      </div>

      <div class="form-group">
        <label for="picture" class="form-label">Image URL</label>
        <input type="url" id="picture" name="picture" class="form-control" placeholder="https://images.unsplash.com/..." required>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Dish Description</label>
        <textarea id="description" name="description" class="form-control" placeholder="Ingredients, preparation style, or taste profile..." required></textarea>
      </div>

      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" id="vegeterian" name="vegeterian" checked>
          <span>🌱 Mark as Vegetarian Dish</span>
        </label>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">Save Menu Item</button>
        <a href="{% url 'admin_menu' restaurant.id %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
